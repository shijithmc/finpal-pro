name: finpal_pro
description: "FinPal Pro — AI-native personal finance app for India."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Local database (offline-first SQLite + FTS5)
  drift: ^2.22.1
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5

  # Authentication: direct Cognito REST API calls (mobile number, no OTP)
  http: ^1.2.2

  # Security: biometric + keystore-backed secure storage
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Calculator: safe expression evaluation (no eval())
  math_expressions: ^2.4.0

  # File sharing (backup/export — PBI-008)
  share_plus: ^10.1.4

  # Camera/gallery capture (AI bill scan — PBI-016)
  image_picker: ^1.1.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  equatable: ^2.0.7
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

  # Test mocking
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
