name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  # ── Lint / test ─────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test test/ --reporter=compact

  # ── Flutter Web build (every PR / push) ─────────────────────────────────────
  build-web:
    name: Build Flutter Web
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web
        # COGNITO_POOL_ID and COGNITO_CLIENT_ID must be set as repository secrets.
        # After CDK deploy, copy UserPoolIdOutput and UserPoolClientIdOutput
        # from cdk-outputs.json to GitHub Settings → Secrets.
        run: |
          flutter build web \
            --release \
            --dart-define=APP_ENV=production \
            --dart-define=COGNITO_POOL_ID=${{ secrets.COGNITO_POOL_ID }} \
            --dart-define=COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: finpal-pro-web-${{ github.sha }}
          path: build/web/
          retention-days: 7

  # ── Deploy Flutter Web to S3 + CloudFront ────────────────────────────────────
  # Runs on every push to main (continuous deploy) and on GitHub Release.
  deploy-web:
    name: Deploy Flutter Web to S3
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: finpal-pro-web-${{ github.sha }}
          path: build/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Resolve S3 bucket + CloudFront ID from SSM
        id: ssm
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/finpal-pro/distribution/bucket-name" \
            --query "Parameter.Value" --output text)
          DIST_ID=$(aws ssm get-parameter \
            --name "/finpal-pro/distribution/id" \
            --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET"   >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      # Content-hashed files: JS/WASM/assets — immutable, 1-year cache.
      - name: Sync immutable assets to S3
        run: |
          aws s3 sync build/web "s3://${{ steps.ssm.outputs.bucket }}" \
            --delete \
            --exclude "*.html" \
            --exclude "flutter_service_worker.js" \
            --cache-control "public, max-age=31536000, immutable"

      # HTML + service worker: no-cache — ensures users get the latest version.
      - name: Sync HTML and service worker to S3
        run: |
          aws s3 sync build/web "s3://${{ steps.ssm.outputs.bucket }}" \
            --exclude "*" \
            --include "*.html" \
            --include "flutter_service_worker.js" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.ssm.outputs.dist_id }}" \
            --paths "/*" \
            --query "Invalidation.Id" --output text)
          echo "CloudFront invalidation: $INVALIDATION_ID"

      - name: Print app URL
        run: |
          DOMAIN=$(aws ssm get-parameter \
            --name "/finpal-pro/distribution/domain" \
            --query "Parameter.Value" --output text)
          echo "App live at: https://${DOMAIN}"

  # ── Deploy AWS infrastructure via CDK (release tag only) ─────────────────────
  deploy-aws:
    name: Deploy AWS Infrastructure (CDK)
    needs: deploy-web
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build CDK project
        run: dotnet build infrastructure/cdk/src --configuration Release --nologo -q

      - name: CDK deploy (all stacks)
        run: cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
        working-directory: infrastructure/cdk
        env:
          APP_ENV: production
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ap-south-1

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs-${{ github.event.release.tag_name }}
          path: infrastructure/cdk/cdk-outputs.json
          retention-days: 90
