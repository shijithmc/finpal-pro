name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  # ── Lint / test ─────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test test/ --reporter=compact

  # ── Flutter Web build (every PR / push) ─────────────────────────────────────
  build-web:
    name: Build Flutter Web
    outputs:
      otp_configured: ${{ steps.auth-config.outputs.ready }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check OTP rollout readiness
        id: auth-config
        env:
          OTP_CLIENT_ID: ${{ secrets.OTP_COGNITO_CLIENT_ID }}
        run: |
          if [ -n "$OTP_CLIENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Web deployment waits for the SMS OTP migration and verified client configuration."
          fi

      - name: Build Flutter Web
        # COGNITO_POOL_ID, OTP_COGNITO_CLIENT_ID and API_BASE_URL must be set as
        # repository secrets. After CDK deploy, copy UserPoolIdOutput,
        # UserPoolClientIdOutput and ApiEndpointOutput from cdk-outputs.json
        # to GitHub Settings → Secrets.
        run: |
          flutter build web \
            --release \
            --dart-define=APP_ENV=production \
            --dart-define=COGNITO_POOL_ID=${{ secrets.COGNITO_POOL_ID }} \
            --dart-define=COGNITO_CLIENT_ID=${{ secrets.OTP_COGNITO_CLIENT_ID }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: finpal-pro-web-${{ github.sha }}
          path: build/web/
          retention-days: 7

  # ── Deploy Flutter Web to S3 + CloudFront ────────────────────────────────────
  # Runs on every push to main (continuous deploy) and on GitHub Release.
  deploy-web:
    name: Deploy Flutter Web to S3
    needs: [build-web, validate-infrastructure]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.event_name == 'release') && needs.build-web.outputs.otp_configured == 'true'

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: finpal-pro-web-${{ github.sha }}
          path: build/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Resolve S3 bucket + CloudFront ID from SSM
        id: ssm
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/finpal-pro/distribution/bucket-name" \
            --query "Parameter.Value" --output text)
          DIST_ID=$(aws ssm get-parameter \
            --name "/finpal-pro/distribution/id" \
            --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET"   >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      # Content-hashed files: JS/WASM/assets — immutable, 1-year cache.
      - name: Sync immutable assets to S3
        run: |
          aws s3 sync build/web "s3://${{ steps.ssm.outputs.bucket }}" \
            --delete \
            --exclude "*.html" \
            --exclude "flutter_service_worker.js" \
            --cache-control "public, max-age=31536000, immutable"

      # HTML + service worker: no-cache — ensures users get the latest version.
      - name: Sync HTML and service worker to S3
        run: |
          aws s3 sync build/web "s3://${{ steps.ssm.outputs.bucket }}" \
            --exclude "*" \
            --include "*.html" \
            --include "flutter_service_worker.js" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.ssm.outputs.dist_id }}" \
            --paths "/*" \
            --query "Invalidation.Id" --output text)
          echo "CloudFront invalidation: $INVALIDATION_ID"

      - name: Print app URL
        run: |
          DOMAIN=$(aws ssm get-parameter \
            --name "/finpal-pro/distribution/domain" \
            --query "Parameter.Value" --output text)
          echo "App live at: https://${DOMAIN}"

  # ── Validate infrastructure without AWS credentials or deployment ───────────
  # Infrastructure cutover is deliberate: follow scripts/SMS_AUTH.md.
  validate-infrastructure:
    name: Validate AWS Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      APP_ENV: test
      CDK_DEFAULT_ACCOUNT: "123456789012"
      CDK_DEFAULT_REGION: ap-south-1
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build CDK project
        run: dotnet build infrastructure/cdk/src/Cdk/Cdk.csproj --configuration Release --nologo

      - name: Test credential migration and deployment guard
        run: node --test scripts/migrate-sms-auth.test.mjs infrastructure/cdk/test/auth-migration-guard.test.mjs

      - name: Synthesize locked-stage templates locally
        working-directory: infrastructure/cdk
        env:
          AUTH_STAGE: locked
          CDK_OUTDIR: cdk.out
        run: dotnet run --project src/Cdk/Cdk.csproj --configuration Release --no-build

      - name: Check synthesized authentication configuration
        run: node --test infrastructure/cdk/test/auth-template.test.mjs
